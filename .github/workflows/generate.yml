name: Generate short

on:
  push:
    branches:
      - agent/eight-stage-research-pipeline
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      topic:
        description: Video topic
        required: true
        type: string
      from_stage:
        description: First stage to run
        required: false
        default: "1"
        type: string
      model:
        description: GitHub Models catalog ID
        required: false
        default: "openai/gpt-4.1"
        type: string

permissions:
  contents: read
  models: read

concurrency:
  group: faceless-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

  research-smoke-test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run researched content pipeline
        id: pipeline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ inputs.model || 'openai/gpt-4.1' }}
          INPUT_TOPIC: ${{ inputs.topic || 'Why is gravity different in different places' }}
          INPUT_FROM_STAGE: ${{ inputs.from_stage || '1' }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            printf 'event=%s\n' "${{ github.event_name }}"
            printf 'sha=%s\n' "${{ github.sha }}"
            printf 'topic=%s\n' "$INPUT_TOPIC"
            printf 'from_stage=%s\n' "$INPUT_FROM_STAGE"
            printf 'model=%s\n' "$GITHUB_MODELS_MODEL"
          } > diagnostics/run-context.txt

          set +e
          python -m pipeline.run \
            --topic "$INPUT_TOPIC" \
            --from-stage "$INPUT_FROM_STAGE" \
            2>&1 | tee diagnostics/pipeline.log
          status=${PIPESTATUS[0]}
          set -e

          RUN_ID="$(sed -n 's/^RUN_ID=//p' diagnostics/pipeline.log | tail -n 1)"
          if [ -n "$RUN_ID" ]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ steps.pipeline.outputs.run_id || github.run_id }}
          path: |
            runs/
            diagnostics/
          if-no-files-found: warn
          retention-days: 7
